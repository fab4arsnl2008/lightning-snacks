<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Prevent browser caching so schedule updates show immediately without refresh -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Wylie Lightning Snack Signup</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Outfit:wght@600;700;800;900&display=swap" rel="stylesheet">

    <!-- React 18, Babel, Tailwind CSS CDN -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        display: ['Outfit', 'Inter', 'sans-serif'],
                    },
                    colors: {
                        gold: '#F5BE18',
                        darkBlack: '#0D1117',
                        charcoal: '#1A1E24',
                        silver: '#A6B0B9',
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0D1117;
            color: #FFFFFF;
            -webkit-tap-highlight-color: transparent;
        }
        .font-display {
            font-family: 'Outfit', 'Inter', sans-serif;
        }

        /* ============================================================
           MD3-INSPIRED MOTION SYSTEM
           Easing: Emphasized (cubic-bezier(0.2, 0, 0, 1.0))
           Standard:  cubic-bezier(0.2, 0, 0, 1)
           ============================================================ */

        /* --- Page load: header slides down --- */
        @keyframes md3-slide-down {
            from { opacity: 0; transform: translateY(-16px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        .anim-header {
            animation: md3-slide-down 350ms cubic-bezier(0.2, 0, 0, 1) both;
        }

        /* --- Staggered card entry (fade + subtle upward slide) --- */
        @keyframes md3-card-enter {
            from { opacity: 0; transform: translateY(20px) scale(0.97); }
            to   { opacity: 1; transform: translateY(0)  scale(1); }
        }
        .anim-card {
            opacity: 0;
            animation: md3-card-enter 400ms cubic-bezier(0.2, 0, 0, 1) forwards;
        }
        /* Stagger delays */
        .anim-card-0  { animation-delay: 40ms;  }
        .anim-card-1  { animation-delay: 80ms;  }
        .anim-card-2  { animation-delay: 120ms; }
        .anim-card-3  { animation-delay: 160ms; }
        .anim-card-4  { animation-delay: 200ms; }
        .anim-card-5  { animation-delay: 240ms; }
        .anim-card-6  { animation-delay: 280ms; }
        .anim-card-7  { animation-delay: 320ms; }

        /* --- Progress bar section entry --- */
        .anim-progress {
            animation: md3-card-enter 380ms cubic-bezier(0.2, 0, 0, 1) 10ms both;
        }

        /* --- Scrim (backdrop) --- */
        @keyframes md3-scrim-in  { from { opacity: 0; } to { opacity: 1; } }
        @keyframes md3-scrim-out { from { opacity: 1; } to { opacity: 0; } }
        .anim-scrim-in  { animation: md3-scrim-in  250ms cubic-bezier(0.2, 0, 0, 1) both; }
        .anim-scrim-out { animation: md3-scrim-out 200ms cubic-bezier(0.4, 0, 1, 1) both; }

        /* --- Modal sheet: slide up from bottom (mobile) / scale-in (desktop) --- */
        @keyframes md3-sheet-in {
            from { opacity: 0; transform: translateY(40px) scale(0.97); }
            to   { opacity: 1; transform: translateY(0)    scale(1); }
        }
        @keyframes md3-sheet-out {
            from { opacity: 1; transform: translateY(0)    scale(1); }
            to   { opacity: 0; transform: translateY(40px) scale(0.97); }
        }
        .anim-sheet-in  { animation: md3-sheet-in  320ms cubic-bezier(0.2, 0, 0, 1) both; }
        .anim-sheet-out { animation: md3-sheet-out 220ms cubic-bezier(0.4, 0, 1, 1) both; }

        /* --- Modal body view transitions (cross-fade between signup/success/manage/confirm) --- */
        @keyframes md3-view-enter {
            from { opacity: 0; transform: translateY(10px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        .anim-view {
            animation: md3-view-enter 280ms cubic-bezier(0.2, 0, 0, 1) both;
        }

        /* --- Success icon pop --- */
        @keyframes md3-pop {
            0%   { transform: scale(0.6); opacity: 0; }
            60%  { transform: scale(1.12); opacity: 1; }
            100% { transform: scale(1); }
        }
        .anim-pop {
            animation: md3-pop 420ms cubic-bezier(0.34, 1.56, 0.64, 1) both;
        }

        /* --- Subtle shimmer on claimed chip --- */
        @keyframes md3-shimmer {
            0%   { background-position: -200% center; }
            100% { background-position: 200% center; }
        }
        .anim-claimed-chip:hover {
            background-image: linear-gradient(90deg, transparent, rgba(255,255,255,0.04), transparent);
            background-size: 200% auto;
            animation: md3-shimmer 1.4s linear infinite;
        }

        /* --- Ripple on button press --- */
        .ripple-btn {
            position: relative;
            overflow: hidden;
        }
        .ripple-btn::after {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(circle, rgba(255,255,255,0.18) 0%, transparent 70%);
            opacity: 0;
            transition: opacity 350ms cubic-bezier(0.2, 0, 0, 1);
            pointer-events: none;
        }
        .ripple-btn:active::after {
            opacity: 1;
            transition: opacity 0ms;
        }

        /* --- Floating label input focus glow (MD3 style) --- */
        input:focus {
            box-shadow: 0 0 0 3px rgba(245,190,24,0.15);
        }

        /* --- Smooth spinner (used in submit button loading state) --- */
        @keyframes spin-smooth {
            to { transform: rotate(360deg); }
        }
        .spin { animation: spin-smooth 0.7s linear infinite; }
    </style>
</head>

<body class="bg-[#0D1117] text-white antialiased selection:bg-[#F5BE18] selection:text-[#0D1117]">
    <div id="root"></div>

    <script type="text/babel" data-type="module">
        // --- FIREBASE IMPORTS ---
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, doc, setDoc, deleteDoc, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        // --- FIREBASE CONFIG ---
        const firebaseConfig = {
            apiKey: "AIzaSyDNVA6hBnk1F-TD_pheKUOLE6dwuiYfpZ4",
            authDomain: "knights-snacks.firebaseapp.com",
            projectId: "knights-snacks",
            storageBucket: "knights-snacks.firebasestorage.app",
            messagingSenderId: "680090441956",
            appId: "1:680090441956:web:17d34365668fb494a434f1"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);

        // --- ICONS (Lucide SVG Components) ---
        const IconBase = ({ children, ...props }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}>{children}</svg>
        );
        const Calendar = (props) => <IconBase {...props}><rect width="18" height="18" x="3" y="4" rx="2" ry="2" /><line x1="16" x2="16" y1="2" y2="6" /><line x1="8" x2="8" y1="2" y2="6" /><line x1="3" x2="21" y1="10" y2="10" /></IconBase>;
        const User = (props) => <IconBase {...props}><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2" /><circle cx="12" cy="7" r="4" /></IconBase>;
        const Users = (props) => <IconBase {...props}><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2" /><circle cx="9" cy="7" r="4" /><path d="M22 21v-2a4 4 0 0 0-3-3.87" /><path d="M16 3.13a4 4 0 0 1 0 7.75" /></IconBase>;
        const CheckCircle = (props) => <IconBase {...props}><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14" /><polyline points="22 4 12 14.01 9 11.01" /></IconBase>;
        const X = (props) => <IconBase {...props}><path d="M18 6 6 18" /><path d="m6 6 12 12" /></IconBase>;
        const ChevronRight = (props) => <IconBase {...props}><path d="m9 18 6-6-6-6" /></IconBase>;
        const AlertTriangle = (props) => <IconBase {...props}><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z" /><line x1="12" x2="12" y1="9" y2="13" /><line x1="12" x2="12.01" y1="17" y2="17" /></IconBase>;
        const Cookie = (props) => <IconBase {...props}><path d="M12 2a10 10 0 1 0 10 10 4 4 0 0 1-5-5 4 4 0 0 1-5-5" /><path d="M8.5 8.5v.01" /><path d="M16 15.5v.01" /><path d="M12 12v.01" /><path d="M11 17v.01" /><path d="M7 14v.01" /></IconBase>;
        const Download = (props) => <IconBase {...props}><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" /><polyline points="7 10 12 15 17 10" /><line x1="12" x2="12" y1="15" y2="3" /></IconBase>;
        const ExternalLink = (props) => <IconBase {...props}><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6" /><polyline points="15 3 21 3 21 9" /><line x1="10" x2="21" y1="14" y2="3" /></IconBase>;
        const Zap = (props) => <IconBase {...props}><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2" /></IconBase>;
        const Sparkles = (props) => <IconBase {...props}><path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z" /></IconBase>;

        // --- BRAND CONSTANTS ---
        const COLORS = {
            gold: '#F5BE18',       // Lightning yellow accent, badges, buttons
            black: '#0D1117',      // Primary dark background
            charcoal: '#1A1E24',   // Card surfaces and container backgrounds
            silver: '#A6B0B9',     // Secondary accents, borders, and subtext
            white: '#FFFFFF',      // Primary headers and contrasting text
        };

        const SCHEDULE_DATES = [
            { id: 'date-1', display: 'Saturday, Mar 7', short: 'Mar 7', start: '20260307T090000', end: '20260307T100000' },
            { id: 'date-2', display: 'Saturday, Mar 14', short: 'Mar 14', start: '20260314T090000', end: '20260314T100000' },
            { id: 'date-3', display: 'Saturday, Mar 21', short: 'Mar 21', start: '20260321T090000', end: '20260321T100000' },
            { id: 'date-4', display: 'Saturday, Mar 28', short: 'Mar 28', start: '20260328T090000', end: '20260328T100000' },
            { id: 'date-5', display: 'Saturday, Apr 4', short: 'Apr 4', start: '20260404T090000', end: '20260404T100000' },
            { id: 'date-6', display: 'Saturday, Apr 11', short: 'Apr 11', start: '20260411T090000', end: '20260411T100000' },
            { id: 'date-7', display: 'Saturday, Apr 18', short: 'Apr 18', start: '20260418T090000', end: '20260418T100000' },
            { id: 'date-8', display: 'Saturday, Apr 25', short: 'Apr 25', start: '20260425T090000', end: '20260425T100000' }
        ];

        const appId = 'wylie-lightning-2026';

        // --- CALENDAR EXPORT HELPERS ---
        const getGoogleCalendarUrl = (selectedDate, parentName, childName) => {
            if (!selectedDate) return '#';
            const title = 'Bring Snacks - Wylie Lightning ⚡🧃';
            const location = 'Wylie Soccer Fields';
            const childText = childName ? ` for ${childName}'s team` : '';
            const details = `Reminder: Snack duty${childText}!\n\nParent: ${parentName || 'Parent'}\nPlayer: ${childName || 'Player'}\nMatch: ${selectedDate.display}\n\nRemember to bring snacks for the team today! Go Lightning! ⚡🧃`;

            const startStr = selectedDate.start || '20260307T090000';
            const endStr = selectedDate.end || '20260307T100000';
            const dates = `${startStr}/${endStr}`;

            const params = new URLSearchParams({
                action: 'TEMPLATE',
                text: title,
                dates: dates,
                details: details,
                location: location,
                ctz: 'America/Chicago',
                add: 'reminder:1440,120'  // 1440 min = 1 day, 120 min = 2 hours
            });

            return `https://calendar.google.com/calendar/render?${params.toString()}`;
        };

        const downloadIcsFile = (selectedDate, parentName, childName) => {
            if (!selectedDate) return;
            const title = 'Bring Snacks - Wylie Lightning ⚡🧃';
            const location = 'Wylie Soccer Fields';
            const childText = childName ? ` for ${childName}'s team` : '';
            const description = `Reminder: Snack duty${childText}!\\n\\nParent: ${parentName || 'Parent'}\\nPlayer: ${childName || 'Player'}\\nMatch: ${selectedDate.display}\\n\\nRemember to bring snacks for the team today! Go Lightning! ⚡🧃`;

            const startStr = selectedDate.start || '20260307T090000';
            const endStr = selectedDate.end || '20260307T100000';

            const nowUtc = new Date().toISOString().replace(/[-:]/g, '').split('.')[0] + 'Z';
            const uid = `wylie-lightning-snack-${selectedDate.id}-${Date.now()}@wylielightning.com`;

            const icsLines = [
                'BEGIN:VCALENDAR',
                'VERSION:2.0',
                'PRODID:-//Wylie Lightning//Snack Schedule//EN',
                'CALSCALE:GREGORIAN',
                'METHOD:PUBLISH',
                'BEGIN:VEVENT',
                `UID:${uid}`,
                `DTSTAMP:${nowUtc}`,
                `DTSTART;TZID=America/Chicago:${startStr}`,
                `DTEND;TZID=America/Chicago:${endStr}`,
                `SUMMARY:${title}`,
                `DESCRIPTION:${description}`,
                `LOCATION:${location}`,
                'STATUS:CONFIRMED',
                'BEGIN:VALARM',
                'ACTION:DISPLAY',
                'DESCRIPTION:Snack Duty Reminder - Wylie Lightning (Tomorrow)',
                'TRIGGER:-P1D',
                'END:VALARM',
                'BEGIN:VALARM',
                'ACTION:DISPLAY',
                'DESCRIPTION:Snack Duty Reminder - Wylie Lightning (2 Hours Prior)',
                'TRIGGER:-PT2H',
                'END:VALARM',
                'END:VEVENT',
                'END:VCALENDAR'
            ];

            const icsContent = icsLines.join('\r\n');
            const blob = new Blob([icsContent], { type: 'text/calendar;charset=utf-8' });
            const link = document.createElement('a');
            link.href = window.URL.createObjectURL(blob);
            link.setAttribute('download', `lightning-snack-${selectedDate.id}.ics`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            window.URL.revokeObjectURL(link.href);
        };

        // --- SUB-COMPONENTS (Defined outside to prevent unmount/remount animation glitches) ---
        const Header = () => (
            <header
                className="w-full relative overflow-hidden border-b-2 shadow-2xl anim-header"
                style={{
                    backgroundColor: COLORS.black,
                    borderBottomColor: COLORS.gold
                }}
            >
                {/* Background glow & lightning ambient flare */}
                <div
                    className="absolute -top-24 left-1/2 -translate-x-1/2 w-96 h-48 rounded-full blur-3xl opacity-20 pointer-events-none"
                    style={{ backgroundColor: COLORS.gold }}
                ></div>
                <div className="absolute top-0 right-0 w-36 h-36 bg-gradient-to-bl from-[#F5BE18]/10 to-transparent rounded-full transform translate-x-12 -translate-y-12 pointer-events-none"></div>

                <div className="max-w-md mx-auto px-4 py-6 flex items-center justify-between relative z-10">
                    <div className="flex items-center space-x-4">
                        {/* Logo */}
                        <div
                            className="p-1 rounded-2xl shadow-xl w-16 h-16 flex items-center justify-center shrink-0 border border-[#F5BE18]/30 transition-transform duration-300 hover:scale-110"
                            style={{ backgroundColor: COLORS.charcoal }}
                        >
                            <img
                                src="./Wylie Lightning Logo.png"
                                alt="Wylie Lightning Logo"
                                className="w-14 h-14 object-contain rounded-xl drop-shadow-md"
                            />
                        </div>
                        <div>
                            <div className="flex items-center space-x-1.5">
                                <h1 className="font-display text-2xl sm:text-3xl font-extrabold tracking-tight" style={{ color: COLORS.white }}>
                                    Wylie Lightning
                                </h1>
                                <Zap className="w-5 h-5 fill-[#F5BE18] text-[#F5BE18] animate-pulse" />
                            </div>
                            <div className="flex items-center space-x-2 mt-0.5">
                                <span
                                    className="text-xs font-black tracking-widest uppercase px-2 py-0.5 rounded-md inline-block font-display"
                                    style={{ backgroundColor: `${COLORS.gold}22`, color: COLORS.gold, border: `1px solid ${COLORS.gold}44` }}
                                >
                                    FALL 2026 SEASON
                                </span>
                                <span className="text-xs font-semibold" style={{ color: COLORS.silver }}>
                                    Snack Schedule
                                </span>
                            </div>
                        </div>
                    </div>
                </div>
            </header>
        );

        const ProgressBar = ({ filled, total }) => {
            const percentage = Math.round((filled / total) * 100);

            return (
                <div
                    className="p-5 mb-6 rounded-2xl border shadow-xl anim-progress"
                    style={{
                        backgroundColor: COLORS.charcoal,
                        borderColor: '#262D36'
                    }}
                >
                    <div className="flex justify-between items-center text-sm mb-3">
                        <div className="flex items-center space-x-2">
                            <span className="w-2.5 h-2.5 rounded-full" style={{ backgroundColor: COLORS.gold }}></span>
                            <span className="font-bold tracking-wide uppercase text-xs" style={{ color: COLORS.silver }}>
                                Season Progress
                            </span>
                        </div>
                        <span className="font-extrabold text-sm" style={{ color: COLORS.white }}>
                            <span style={{ color: COLORS.gold }}>{filled}</span> of {total} Matches Covered
                        </span>
                    </div>
                    <div className="w-full bg-[#0D1117] rounded-full h-3 p-0.5 border border-[#262D36] overflow-hidden">
                        <div
                            className="h-full rounded-full transition-all duration-700 ease-out shadow-sm"
                            style={{
                                width: `${percentage}%`,
                                backgroundColor: COLORS.gold,
                                boxShadow: percentage > 0 ? `0 0 10px ${COLORS.gold}88` : 'none'
                            }}
                        ></div>
                    </div>
                </div>
            );
        };

        // --- MAIN COMPONENT ---
        const LightningCalendar = () => {
            const [user, setUser] = React.useState(null);
            const [signups, setSignups] = React.useState({});
            const [loading, setLoading] = React.useState(true);
            const [selectedDate, setSelectedDate] = React.useState(null);
            const [isModalOpen, setIsModalOpen] = React.useState(false);
            const [isModalClosing, setIsModalClosing] = React.useState(false); // drives exit animation
            const [formData, setFormData] = React.useState({ parentName: '', childName: '' });
            const [viewMode, setViewMode] = React.useState('list'); // 'list', 'signup', 'manage', 'delete_confirm', 'success'
            const [prevViewMode, setPrevViewMode] = React.useState(null); // for view-transition key
            const [icsDownloaded, setIcsDownloaded] = React.useState(false);
            const [isSubmitting, setIsSubmitting] = React.useState(false);
            const [isDeleting, setIsDeleting] = React.useState(false);

            // Auth
            React.useEffect(() => {
                signInAnonymously(auth);
                const unsubscribe = onAuthStateChanged(auth, (currentUser) => {
                    setUser(currentUser);
                });
                return () => unsubscribe();
            }, []);

            // Data Sync
            React.useEffect(() => {
                if (!user) return;
                const unsubscribe = onSnapshot(
                    collection(db, 'artifacts', appId, 'public', 'data', 'snack_signups'),
                    (snapshot) => {
                        const data = {};
                        snapshot.forEach(doc => {
                            data[doc.id] = doc.data();
                        });
                        setSignups(data);
                        setLoading(false);
                    },
                    (error) => {
                        console.error("Error fetching signups:", error);
                        setLoading(false);
                    }
                );
                return () => unsubscribe();
            }, [user]);

            // Handlers
            const handleDateClick = (dateObj) => {
                const existingSignup = signups[dateObj.id];
                setSelectedDate(dateObj);
                setIcsDownloaded(false);
                if (existingSignup) {
                    setFormData({
                        parentName: existingSignup.parentName,
                        childName: existingSignup.childName || '' // Handle legacy records
                    });
                    setViewMode('manage');
                } else {
                    setFormData({ parentName: '', childName: '' });
                    setViewMode('signup');
                }
                setIsModalOpen(true);
            };

            const handleInputChange = (e) => {
                setFormData({ ...formData, [e.target.name]: e.target.value });
            };

            const handleSubmit = async (e) => {
                e.preventDefault();
                if (!selectedDate || !user || isSubmitting) return;
                setIsSubmitting(true);
                try {
                    await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'snack_signups', selectedDate.id), {
                        parentName: formData.parentName.trim(),
                        childName: formData.childName.trim(),
                        dateId: selectedDate.id,
                        dateDisplay: selectedDate.display,
                        timestamp: serverTimestamp(),
                        userId: user.uid
                    });
                    setPrevViewMode('signup');
                    setViewMode('success');
                } catch (err) {
                    console.error("Error saving signup:", err);
                    alert("Error saving. Please try again.");
                } finally {
                    setIsSubmitting(false);
                }
            };

            const confirmDelete = async () => {
                if (!selectedDate || !user || isDeleting) return;
                setIsDeleting(true);
                try {
                    await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'snack_signups', selectedDate.id));
                    closeModal();
                } catch (err) {
                    console.error("Error removing signup:", err);
                } finally {
                    setIsDeleting(false);
                }
            };

            const closeModal = () => {
                // Trigger exit animation, then unmount
                setIsModalClosing(true);
                setTimeout(() => {
                    setIsModalOpen(false);
                    setIsModalClosing(false);
                    setSelectedDate(null);
                    setFormData({ parentName: '', childName: '' });
                    setIcsDownloaded(false);
                    setPrevViewMode(null);
                }, 220);
            };

            const initiateCancel = () => { setPrevViewMode('manage'); setViewMode('delete_confirm'); };

            const handleDownloadIcs = () => {
                downloadIcsFile(selectedDate, formData.parentName, formData.childName);
                setIcsDownloaded(true);
                setTimeout(() => setIcsDownloaded(false), 3000);
            };
